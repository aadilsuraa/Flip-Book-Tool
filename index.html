<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquareZix – Company Profile</title>
  <link rel="icon" href="https://squarezix.com/wp-content/uploads/2024/05/cropped-SZ-Logo-270x270.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --surface: #0d0d0d;
      --s2: #161616;
      --border: rgba(255, 255, 255, .08);
      --accent: #e63329;
      --accentl: #ff4d42;
      --adim: rgba(230, 51, 41, .12);
      --text: #f5f5f5;
      --muted: #555;
      --muted2: #999;
    }

    * { margin: 0; padding: 0; box-sizing: border-box }

    html, body {
      height: 100vh;
      overflow-x: hidden;
      overflow-y: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased
    }

    nav {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.4rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 600;
      background: rgba(0,0,0,.97);
      backdrop-filter: blur(20px)
    }

    .logo { display: flex; align-items: center; gap: .55rem }
    .logo img { height: 30px; object-fit: contain }
    .logo-txt { font-weight: 700; font-size: .9rem; letter-spacing: .1em; text-transform: uppercase }
    .logo-txt span { color: var(--accent) }
    .nav-tag {
      font-size: .62rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: white;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .2rem .5rem
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem
    }

    .ld-logo { font-weight: 700; font-size: 1.9rem; letter-spacing: .15em; text-transform: uppercase }
    .ld-logo span { color: var(--accent) }
    .ld-bar { width: 200px; height: 2px; background: var(--s2); border-radius: 99px; overflow: hidden }
    .ld-fill { height: 100%; width: 0%; background: radial-gradient(ellipse 80% 70% at 50% 50%, #AB24F2, #7736F1); border-radius: 99px; transition: width .2s ease }
    .ld-txt { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted2); font-weight: 500 }
    /* Sub-label for pages rendered count */
    .ld-sub { font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; min-height: 1em }

    #sv { display: none }

    .vbar {
      height: auto;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 .8rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 56px;
      z-index: 500;
      gap: .3rem;
      flex-wrap: wrap
    }

    .vbl { display: flex; align-items: center; gap: .5rem }
    .vbr { display: flex; align-items: center; gap: .25rem; flex-wrap: wrap; padding: .35rem 0 }
    .pn { font-size: .7rem; color: var(--muted2); font-weight: 500; letter-spacing: .04em; white-space: nowrap; min-width: 78px }

    .vt {
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--muted2);
      border-radius: 5px;
      padding: .26rem .55rem;
      font-size: .62rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: .12s;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .vt:hover {
      color: #fff !important;
      border: none;
      border-radius: 0.375em;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .vt.on {
      color: #fff !important;
      border: none;
      border-radius: 0.375em;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .zoom-wrap { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 5px; overflow: hidden }
    .zb { background: var(--s2); border: none; color: var(--muted2); width: 26px; height: 24px; font-size: .95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: .12s }
    .zb:hover { background: var(--adim); color: var(--accentl) }
    .z-val { font-size: .62rem; color: var(--muted2); padding: 0 .35rem; min-width: 34px; text-align: center; font-weight: 600; background: var(--s2) }

    .snd {
      display: flex;
      align-items: center;
      gap: .28rem;
      font-size: .62rem;
      color: var(--muted2);
      cursor: pointer;
      user-select: none;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: .26rem .55rem;
      transition: .12s;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .snd.on {
      color: #fff !important;
      border: none;
      border-radius: 0.375em;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stage {
      width: 100vw;
      height: calc(100vh - 102px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, #0a0a0a, #000);
      position: relative;
      overflow: hidden;
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 38%, rgba(0,0,0,.6) 100%)
    }

    #book-root {
      position: relative;
      z-index: 3;
      transform-origin: center center;
      transition: transform .18s ease
    }

    #book-root::after {
      content: '';
      position: absolute;
      bottom: -26px;
      left: 8%;
      right: 8%;
      height: 32px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse 85% 100% at 50% 0%, rgba(0,0,0,.65), transparent);
      filter: blur(12px)
    }

    .arr {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0,0,0,.92);
      border: 1px solid rgba(255,255,255,.1);
      color: var(--text);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .15s;
      user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,.6)
    }

    .arr:hover {
      color: #fff !important;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .arr.off { opacity: 0; pointer-events: none; transform: translateY(-50%) scale(.85) }
    #arr-p { left: .8rem }
    #arr-n { right: .8rem }

    #spf-host .page { background: #fff; overflow: hidden }
    #spf-host .page canvas { display: block; width: 100% !important; height: 100% !important }

    .sl-clip { overflow: hidden }
    .sl-track { display: flex; will-change: transform }

    .ts {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: .45rem .8rem;
      background: var(--surface);
      border-top: 1px solid var(--border)
    }

    .ts::-webkit-scrollbar { height: 3px }
    .ts::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 99px }

    .thumb {
      flex-shrink: 0;
      width: 36px;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
      transition: .12s
    }

    .thumb:hover { border-color: rgba(230,51,41,.5); transform: translateY(-2px) }
    .thumb.cur { border-color: #AB24F2; box-shadow: 0 0 0 1px #AB24F2; }
    .thumb canvas { display: block; width: 100%; height: auto }

    /* Placeholder thumb while rendering */
    .thumb-ph {
      flex-shrink: 0;
      width: 36px;
      height: 48px;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      background: var(--s2);
      animation: ph-pulse 1.4s ease-in-out infinite;
    }

    @keyframes ph-pulse {
      0%, 100% { opacity: .35 }
      50% { opacity: .7 }
    }

    #err {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 56px);
      gap: 1rem;
      padding: 2rem;
      text-align: center
    }

    #err h2 { font-size: 1.2rem; font-weight: 700 }
    #err p { color: var(--muted2); max-width: 340px; line-height: 1.7; font-size: .82rem }
    #err code { background: var(--s2); padding: .2rem .5rem; border-radius: 4px; font-size: .72rem; color: var(--accentl) }

    /* ── MOBILE RESPONSIVE ── */
    @media (max-width: 640px) {
      nav { padding: 0 .8rem; height: 48px; }
      .logo-txt { font-size: .78rem; }
      .nav-tag { font-size: .54rem; padding: .15rem .35rem; letter-spacing: .1em; }
      .vbar { top: 48px; padding: .3rem .5rem; gap: .2rem; }
      .vbr { gap: .2rem; padding: .25rem 0; }
      .vt { padding: .22rem .42rem; font-size: .56rem; }
      .pn { font-size: .62rem; min-width: 60px; }
      .zb { width: 24px; height: 22px; font-size: .85rem; }
      .z-val { font-size: .56rem; min-width: 28px; }
      .snd { font-size: .56rem; padding: .22rem .42rem; }
      .stage { height: calc(100dvh - 48px - 60px - 52px); min-height: 200px; }
      .arr { width: 36px; height: 36px; font-size: 1.1rem; }
      #arr-p { left: .35rem; }
      #arr-n { right: .35rem; }
      .ts { padding: .35rem .5rem; }
      .thumb { width: 28px; }
    }

    @media (max-width: 380px) {
      .nav-tag { display: none; }
    }
    /* Protection styles: apply only where needed (use class="protect" on images) */
    img.protect { -webkit-user-drag: none; user-drag: none; user-select: none; -webkit-user-select: none; }
    .protect-wrap { position: relative; display: inline-block }
    .protect-overlay { position: absolute; inset: 0; z-index: 20; }
    canvas.protect-canvas { display: block; max-width: 100%; height: auto; }
  </style>
</head>

<body>

  <div id="loading">
    <div class="ld-logo">SquareZix</div>
    <div class="ld-bar"><div class="ld-fill" id="ldf"></div></div>
    <div class="ld-txt" id="ldt">Loading Company Profile…</div>
    <div class="ld-sub" id="ldsub"></div>
  </div>

  <nav>
    <div class="logo">
      <img src="https://squarezix.com/wp-content/uploads/2024/05/cropped-SZ-Logo.png" alt="SquareZix" onerror="this.style.display='none'">
      <span class="logo-txt">SquareZix</span>
    </div>
    <span class="nav-tag">Company Profile</span>
  </nav>

  <div id="err">
    <h2>Could not load PDF</h2>
    <p>Place the PDF in the same folder as this HTML and open via a local server. Expected:</p>
    <code id="err-path"></code>
  </div>

  <section id="sv">
    <div class="vbar">
      <div class="vbl"><span class="pn" id="pn">Page 1 of —</span></div>
      <div class="vbr">
        <button class="vt on" data-v="magazine" onclick="swFx(this)">📖 Magazine</button>
        <button class="vt" data-v="book" onclick="swFx(this)">📚 Book</button>
        <button class="vt" data-v="slider" onclick="swFx(this)">🎞️ Slider</button>
        <div class="zoom-wrap">
          <button class="zb" onclick="zoom(-1)">−</button>
          <span class="z-val" id="zval">100%</span>
          <button class="zb" onclick="zoom(1)">+</button>
        </div>
        <div class="snd on" id="snd" onclick="toggleSnd()"><span id="sico">🔊</span> Sound</div>
      </div>
    </div>
    <div class="stage" id="stage">
      <button class="arr off" id="arr-p" onclick="goPrev()">&#8249;</button>
      <div id="book-root"></div>
      <button class="arr off" id="arr-n" onclick="goNext()">&#8250;</button>
    </div>
    <div class="ts" id="ts"></div>
  </section>

  <script>
    'use strict';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const PDF_URL = './SZ-CompanyProfile-2026.pdf';

    /* STATE */
    let pdfDoc, total;

    // ─── KEY OPTIMISATION: cap DPR at 2 (was 3).
    // A DPR-3 canvas has 9× the pixels of DPR-1, crushing render time.
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

     /* === Protection utilities ===
       - Blocks common save/inspect keyboard shortcuts
       - Disables context menu unless an element has class `allow-context`
       - Converts <img class="protect"> into a canvas to block drag/right-click
     */
    function blockShortcuts() {
      window.addEventListener('keydown', e => {
        if (e.ctrlKey || e.metaKey) {
          const k = e.key.toLowerCase();
          if (k === 's' || k === 'p' || k === 'u' || (e.shiftKey && k === 'i')) {
            e.preventDefault(); e.stopPropagation();
          }
        }
        // F12
        if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
      }, { passive: false });
    }

    function blockContextMenu() {
      document.addEventListener('contextmenu', e => {
        // allow context where explicitly permitted
        if (e.target.closest && e.target.closest('.allow-context')) return;
        e.preventDefault();
      });
      document.addEventListener('dragstart', e => e.preventDefault());
    }

    async function convertProtectedImages() {
      const imgs = Array.from(document.querySelectorAll('img.protect'));
      for (const img of imgs) {
        try {
          const w = img.naturalWidth || img.width || img.clientWidth || 300;
          const h = img.naturalHeight || img.height || img.clientHeight || 200;
          const c = document.createElement('canvas');
          c.width = w; c.height = h; c.className = 'protect-canvas';
          const ctx = c.getContext('2d');
          // draw white background if transparent
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
          await new Promise((res, rej) => {
            const tmp = new Image();
            tmp.crossOrigin = 'anonymous';
            tmp.onload = () => { ctx.drawImage(tmp, 0, 0, w, h); res(); };
            tmp.onerror = rej; tmp.src = img.src;
            // if already loaded
            if (img.complete && img.naturalWidth) {
              ctx.drawImage(img, 0, 0, w, h); res();
            }
          });
          // protected image converted to canvas (no watermark)
          const wrap = document.createElement('span'); wrap.className = 'protect-wrap';
          wrap.style.width = img.width ? img.width + 'px' : 'auto';
          wrap.appendChild(c);
          // overlay to block interactions
          const ov = document.createElement('div'); ov.className = 'protect-overlay';
          wrap.appendChild(ov);
          img.replaceWith(wrap);
        } catch (e) {
          // fallback: leave image but disable drag/context
          img.draggable = false;
          img.addEventListener('contextmenu', ev => ev.preventDefault());
        }
      }
    }

    let cache = [];          // full-res canvases, indexed by page
    let thumbs = [];         // thumbnail canvases, indexed by page
    let pgW, pgH;
    let cacheReady = false;  // true only once ALL pages are in cache
    let zoomLvl = 1.0, effect = 'magazine', cur = 0, pf = null, busy = false, _st = {};
    let soundOn = true;

    /* SOUND */
    const SND = {};
    ['sm', 'md', 'lg'].forEach(k => { const a = new Audio(`./flip-sound.mp3`); a.preload = 'auto'; SND[k] = a; });
    let _ft = 0;
    function onFlipStart() { _ft = performance.now(); }
    function playFlip() {
      if (!soundOn) return;
      const v = Math.max(0.3, Math.min(2, 600 / (performance.now() - _ft || 400)));
      const a = SND[v > 1.5 ? 'lg' : v > 0.7 ? 'md' : 'sm'];
      a.currentTime = 0; a.volume = Math.min(1, 0.45 + v * 0.28); a.play().catch(() => {});
      _ft = 0;
    }
    function toggleSnd() {
      soundOn = !soundOn;
      document.getElementById('snd').classList.toggle('on', soundOn);
      document.getElementById('sico').textContent = soundOn ? '🔊' : '🔇';
    }

    /* ZOOM */
    function zoom(dir) {
      zoomLvl = Math.max(0.4, Math.min(2.5, Math.round((zoomLvl + dir * 0.1) * 10) / 10));
      document.getElementById('zval').textContent = Math.round(zoomLvl * 100) + '%';
      document.getElementById('book-root').style.transform = `scale(${zoomLvl})`;
    }
    document.addEventListener('wheel', e => {
      if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }
    }, { passive: false });
    document.addEventListener('keydown', e => {
      if (document.getElementById('sv').style.display === 'none') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goNext();
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goPrev();
      if (e.key === '=' || e.key === '+') zoom(1);
      if (e.key === '-') zoom(-1);
    });

    function getStageSize() {
      const el = document.getElementById('stage');
      return { w: el.clientWidth, h: el.clientHeight };
    }

    /* ─────────────────────────────────────────────────────────────
       MAIN LOAD
       Key optimisations vs original:
         1. Render pages in PARALLEL batches of BATCH_SIZE instead
            of sequentially with await-in-a-loop.
         2. Show the viewer as soon as ALL pages are rendered.
         3. Render thumbnails AFTER the viewer is visible, in a
            separate async pass — they never block page display.
         4. DPR capped at 2 (see above).
         5. Page viewport scale computed ONCE and reused.
    ───────────────────────────────────────────────────────────── */
    const BATCH_SIZE = 4;   // render 4 pages concurrently; tune to taste

    window.addEventListener('load', async () => {
      const setP   = (p, msg) => {
        document.getElementById('ldf').style.width = p + '%';
        document.getElementById('ldt').textContent = msg;
      };
      const setSub = msg => { document.getElementById('ldsub').textContent = msg; };

      // initialise UI protections and image conversions
      try { blockShortcuts(); blockContextMenu(); convertProtectedImages(); } catch (e) { console.warn('protection init failed', e); }

      try {
        setP(5, 'Fetching PDF…');
        const res = await fetch(PDF_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();

        setP(15, 'Parsing document…');
        pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
        total = pdfDoc.numPages;

        // ── Compute display size from first page (done once) ──
        const vp0 = (await pdfDoc.getPage(1)).getViewport({ scale: 1 });
        const asp  = vp0.height / vp0.width;
        const stW  = window.innerWidth - 100, stH = window.innerHeight - 120;
        pgW = Math.floor((stW - 8) / 2);
        pgH = Math.round(pgW * asp);
        if (pgH > stH - 20) { pgH = stH - 20; pgW = Math.round(pgH / asp); }

        const physW = Math.round(pgW * DPR);
        const physH = Math.round(pgH * DPR);
        // ── Render scale computed once from page 1 dimensions ──
        const renderScale = physW / vp0.width;

        cache  = new Array(total);
        thumbs = new Array(total);

        setP(18, 'Rendering pages…');

        // ── Parallel batch rendering ──
        let done = 0;
        for (let start = 0; start < total; start += BATCH_SIZE) {
          const end   = Math.min(start + BATCH_SIZE, total);
          const batch = [];

          for (let i = start; i < end; i++) {
            batch.push((async idx => {
              const pg = await pdfDoc.getPage(idx + 1);
              const vp = pg.getViewport({ scale: renderScale });

              const c   = document.createElement('canvas');
              c.width   = physW;
              c.height  = physH;
              const ctx = c.getContext('2d', { alpha: false });
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, physW, physH);
              await pg.render({ canvasContext: ctx, viewport: vp }).promise;
              cache[idx] = c;
            })(i));
          }

          await Promise.all(batch);

          done += (end - start);
          const pct = 18 + Math.round((done / total) * 77);
          setP(pct, 'Rendering pages…');
          setSub(`${done} / ${total} pages ready`);
        }

        // ── Show viewer immediately — all pages are in cache ──
        cacheReady = true;
        setP(100, 'Ready');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('sv').style.display = 'block';
        build(effect);
        syncTabs(effect);

        // ── Render placeholder thumbs instantly, real ones async ──
        buildThumbPlaceholders();
        renderThumbsAsync();   // runs in background, does not block

      } catch (e) {
        console.error(e);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('err').style.display = 'flex';
        document.getElementById('err-path').textContent = PDF_URL;
      }
    });

    /* ── Resize rebuild ── */
    let _resizeTimer;
    window.addEventListener('resize', () => {
      if (!cacheReady) return;   // don't rebuild while pages are still rendering
      clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(() => { build(effect); }, 220);
    });

    /* ─────────────────────────────────────────────────────────────
       THUMBNAIL RENDERING — entirely async, after viewer is shown
    ───────────────────────────────────────────────────────────── */
    function buildThumbPlaceholders() {
      const strip = document.getElementById('ts');
      strip.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const ph = document.createElement('div');
        ph.className = 'thumb-ph';
        ph.id = `th-${i}`;
        strip.appendChild(ph);
      }
    }

    async function renderThumbsAsync() {
      const THUMB_SCALE = 0.12;   // small enough to be fast
      const THUMB_BATCH = 6;      // more concurrent for tiny renders

      for (let start = 0; start < total; start += THUMB_BATCH) {
        const end   = Math.min(start + THUMB_BATCH, total);
        const batch = [];

        for (let i = start; i < end; i++) {
          batch.push((async idx => {
            const pg  = await pdfDoc.getPage(idx + 1);
            const tvp = pg.getViewport({ scale: THUMB_SCALE });
            const tc  = document.createElement('canvas');
            tc.width  = tvp.width;
            tc.height = tvp.height;
            const tx  = tc.getContext('2d', { alpha: false });
            tx.fillStyle = '#fff';
            tx.fillRect(0, 0, tc.width, tc.height);
            await pg.render({ canvasContext: tx, viewport: tvp }).promise;
            thumbs[idx] = tc;

            // Swap placeholder with real thumb
            const ph = document.getElementById(`th-${idx}`);
            if (ph) {
              const wrap = document.createElement('div');
              wrap.className = 'thumb' + (idx === cur ? ' cur' : '');
              wrap.id = `th-${idx}`;
              const c = document.createElement('canvas');
              c.width  = tc.width;
              c.height = tc.height;
              c.getContext('2d').drawImage(tc, 0, 0);
              wrap.appendChild(c);
              wrap.onclick = () => jumpTo(idx);
              ph.replaceWith(wrap);
            }
          })(i));
        }

        await Promise.all(batch);
        // Yield to the browser between thumbnail batches so the
        // page-flip animation stays perfectly smooth
        await new Promise(r => setTimeout(r, 0));
      }
    }

    /* ─────────────────────────────────────────────────────────────
       PAGE CANVAS HELPER
    ───────────────────────────────────────────────────────────── */
    function pageCanvas(i, w, h) {
      const wrap = document.createElement('div');
      wrap.style.cssText = `width:${w}px;height:${h}px;overflow:hidden;background:#fff;flex-shrink:0`;
      const c   = document.createElement('canvas');
      c.width   = Math.round(w * DPR);
      c.height  = Math.round(h * DPR);
      c.style.cssText = `width:${w}px;height:${h}px;display:block`;
      const ctx = c.getContext('2d', { alpha: false });
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      if (cache[i] instanceof HTMLCanvasElement) {
        ctx.drawImage(cache[i], 0, 0, c.width, c.height);
      }
      wrap.appendChild(c);
      return wrap;
    }

    /* ─────────────────────────────────────────────────────────────
       DESTROY / BUILD
    ───────────────────────────────────────────────────────────── */
    function destroy() {
      if (pf) { try { pf.destroy(); } catch (e) {} pf = null; }
      document.getElementById('book-root').innerHTML = '';
      busy = false; _st = {};
    }

    function build(e) {
      destroy();
      const { w, h } = getStageSize();
      if      (e === 'magazine' || e === 'book') buildMagBook(e, w, h);
      else if (e === 'slider')  buildSlider(w, h);
      updateUI();
    }

    function swFx(btn) { if (!cacheReady) return; effect = btn.dataset.v; syncTabs(effect); build(effect); }
    function syncTabs(e) { document.querySelectorAll('.vt[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === e)); }

    /* ─────────────────────────────────────────────────────────────
       MAGAZINE / BOOK
    ───────────────────────────────────────────────────────────── */
    function buildMagBook(mode, stW, stH) {
      const isMobile = window.innerWidth <= 640;
      const root = document.getElementById('book-root');
      const asp  = pgH / pgW;

      let w, h;
      if (isMobile) {
        w = Math.min(stW - 40, pgW);
        h = Math.round(w * asp);
        if (h > stH - 20) { h = stH - 20; w = Math.round(h / asp); }
      } else {
        w = Math.min(Math.floor((stW - 80) / 2), pgW);
        h = Math.round(w * asp);
        if (h > stH - 20) { h = stH - 20; w = Math.round(h / asp); }
      }

      const host = document.createElement('div'); host.id = 'spf-host'; root.appendChild(host);
      const divs = [];
      for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'page';
        d.style.cssText = `width:${w}px;height:${h}px;overflow:hidden;background:#fff`;
        if (i === 0 || i === total - 1) d.dataset.density = 'hard';
        const c = document.createElement('canvas');
        c.width  = Math.round(w * DPR);
        c.height = Math.round(h * DPR);
        c.style.cssText = `width:${w}px;height:${h}px;display:block`;
        const ctx2d = c.getContext('2d', { alpha: false });
        ctx2d.fillStyle = '#fff';
        ctx2d.fillRect(0, 0, c.width, c.height);
        // Guard: cache[i] may be undefined if build() fires before all
        // pages have rendered (resize during load, or mode switch).
        if (cache[i] instanceof HTMLCanvasElement) {
          ctx2d.drawImage(cache[i], 0, 0, c.width, c.height);
        }
        d.appendChild(c); host.appendChild(d); divs.push(d);
      }

      // ── Passive-touch patch ──────────────────────────────────────
      // page-flip registers touchstart without { passive: true }, which
      // triggers a browser intervention warning on mobile and can block
      // scrolling. We intercept addEventListener on the host element so
      // any touch* listener page-flip attaches is silently forced passive.
      const _origAEL = host.addEventListener.bind(host);
      host.addEventListener = function(type, fn, opts) {
        if (type === 'touchstart' || type === 'touchmove' || type === 'touchend') {
          if (typeof opts === 'boolean') opts = { capture: opts };
          else if (!opts || typeof opts !== 'object') opts = {};
          opts.passive = true;
        }
        return _origAEL(type, fn, opts);
      };
      // ────────────────────────────────────────────────────────────

      pf = new St.PageFlip(host, {
        width: w, height: h, size: 'fixed', drawShadow: true,
        flippingTime: mode === 'book' ? 440 : 860,
        usePortrait: isMobile, autoSize: true,
        maxShadowOpacity: mode === 'book' ? 0.30 : 0.72,
        showCover: true, mobileScrollSupport: false,
        useMouseEvents: true, swipeDistance: 16, clickEventForward: false, startPage: cur,
      });
      pf.loadFromHTML(divs);
      pf.on('changeState', onFlipStart);
      pf.on('flip', e => { cur = e.data; playFlip(); updateUI(); });
      _st = { w, h };
    }

    /* ─────────────────────────────────────────────────────────────
       SLIDER
    ───────────────────────────────────────────────────────────── */
    function buildSlider(stW, stH) {
      const asp = pgH / pgW;
      let w = stW - 40, h = Math.round(w * asp);
      if (h > stH - 20) { h = stH - 20; w = Math.round(h / asp); }
      const root = document.getElementById('book-root');
      const clip = document.createElement('div'); clip.className = 'sl-clip';
      clip.style.cssText = `width:${w}px;height:${h}px;box-shadow:0 14px 50px rgba(0,0,0,.75),0 60px 130px rgba(0,0,0,.8)`;
      const track = document.createElement('div'); track.className = 'sl-track';
      track.style.cssText = `width:${total * w}px;height:${h}px;transition:transform .55s cubic-bezier(.4,0,.2,1)`;
      for (let i = 0; i < total; i++) track.appendChild(pageCanvas(i, w, h));
      clip.appendChild(track); root.appendChild(clip);
      _st = { w, h, track }; addSwipe(clip); sliderTo(cur);
    }

    function sliderTo(i) { if (_st.track) _st.track.style.transform = `translateX(-${i * _st.w}px)`; }

    /* SWIPE */
    function addSwipe(el) {
      let sx = 0;
      el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
      el.addEventListener('touchend',   e => { const dx = e.changedTouches[0].clientX - sx; if (dx < -30) goNext(); else if (dx > 30) goPrev(); });
    }

    /* ─────────────────────────────────────────────────────────────
       NAVIGATION
    ───────────────────────────────────────────────────────────── */
    function goNext() {
      if (busy) return;
      if (effect === 'magazine' || effect === 'book') { if (pf) { onFlipStart(); pf.flipNext('bottom'); } return; }
      if (cur >= total - 1) return; cur++; playFlip(); dispatch('next');
    }
    function goPrev() {
      if (busy) return;
      if (effect === 'magazine' || effect === 'book') { if (pf) { onFlipStart(); pf.flipPrev('bottom'); } return; }
      if (cur <= 0) return; cur--; playFlip(); dispatch('prev');
    }
    function dispatch(dir) {
      if (effect === 'slider') sliderTo(cur);
      updateUI();
    }
    function jumpTo(idx) {
      if (effect === 'magazine' || effect === 'book') { if (pf) { pf.flip(idx); return; } }
      const dir = idx > cur ? 'next' : 'prev'; cur = idx; playFlip(); dispatch(dir); updateUI();
    }

    /* ─────────────────────────────────────────────────────────────
       UI
    ───────────────────────────────────────────────────────────── */
    function updateUI() {
      document.getElementById('pn').textContent = `Page ${cur + 1} of ${total}`;
      document.getElementById('arr-p').classList.toggle('off', cur <= 0);
      document.getElementById('arr-n').classList.toggle('off', cur >= total - 1);
      document.querySelectorAll('.thumb').forEach((t, i) => {
        t.classList.toggle('cur', i === cur);
        if (i === cur) t.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
      });
    }
  </script>

  <script src="https://chatbot.squarezix.com/static/chatbot.js"></script>
</body>
