<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquareZix – Company Profile</title>
  <link rel="icon" href="https://squarezix.com/wp-content/uploads/2024/05/cropped-SZ-Logo-270x270.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --surface: #0d0d0d;
      --s2: #161616;
      --border: rgba(255, 255, 255, .08);
      --accent: #e63329;
      --accentl: #ff4d42;
      --adim: rgba(230, 51, 41, .12);
      --text: #f5f5f5;
      --muted: #555;
      --muted2: #999;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100vh;
      overflow-x: hidden;
      overflow-y: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased
    }

    nav {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.4rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 600;
      background: rgba(0, 0, 0, .97);
      backdrop-filter: blur(20px)
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .55rem
    }

    .logo img {
      height: 30px;
      object-fit: contain
    }

    .logo-txt {
      font-weight: 700;
      font-size: .9rem;
      letter-spacing: .1em;
      text-transform: uppercase
    }

    .logo-txt span {
      color: var(--accent)
    }

    .nav-tag {
      font-size: .62rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: white;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .2rem .5rem
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem
    }

    .ld-logo {
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: .15em;
      text-transform: uppercase
    }

    .ld-logo span {
      color: var(--accent)
    }

    .ld-bar {
      width: 200px;
      height: 2px;
      background: var(--s2);
      border-radius: 99px;
      overflow: hidden
    }

    .ld-fill {
      height: 100%;
      width: 0%;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, #AB24F2, #7736F1);
      border-radius: 99px;
      transition: width .2s ease
    }

    .ld-txt {
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted2);
      font-weight: 500
    }

    #sv {
      display: none
    }

    .vbar {
      height: auto;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 .8rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 56px;
      z-index: 500;
      gap: .3rem;
      flex-wrap: wrap
    }

    .vbl {
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .vbr {
      display: flex;
      align-items: center;
      gap: .25rem;
      flex-wrap: wrap;
      padding: .35rem 0
    }

    .pn {
      font-size: .7rem;
      color: var(--muted2);
      font-weight: 500;
      letter-spacing: .04em;
      white-space: nowrap;
      min-width: 78px
    }

    .vt {
      background: var(--s2);
      border: 1px solid var(--border);
      color: var(--muted2);
      border-radius: 5px;
      padding: .26rem .55rem;
      font-size: .62rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: .12s;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .vt:hover {
      color: #fff !important;
      border: none;
      border-radius: 0.375em;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .vt.on {
      color: #fff !important;
      border: none;
      border-radius: 0.375em;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .zoom-wrap {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 5px;
      overflow: hidden
    }

    .zb {
      background: var(--s2);
      border: none;
      color: var(--muted2);
      width: 26px;
      height: 24px;
      font-size: .95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .12s
    }

    .zb:hover {
      background: var(--adim);
      color: var(--accentl)
    }

    .z-val {
      font-size: .62rem;
      color: var(--muted2);
      padding: 0 .35rem;
      min-width: 34px;
      text-align: center;
      font-weight: 600;
      background: var(--s2)
    }

    .snd {
      display: flex;
      align-items: center;
      gap: .28rem;
      font-size: .62rem;
      color: var(--muted2);
      cursor: pointer;
      user-select: none;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: .26rem .55rem;
      transition: .12s;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .snd.on {
      color: #fff !important;
      border: none;
      border-radius: 0.375em;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stage {
      width: 100vw;
      height: calc(100vh - 102px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, #0a0a0a, #000);
      position: relative;
      overflow: hidden;
    }

    .stage::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 38%, rgba(0, 0, 0, .6) 100%)
    }

    #book-root {
      position: relative;
      z-index: 3;
      transform-origin: center center;
      transition: transform .18s ease
    }

    #book-root::after {
      content: '';
      position: absolute;
      bottom: -26px;
      left: 8%;
      right: 8%;
      height: 32px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse 85% 100% at 50% 0%, rgba(0, 0, 0, .65), transparent);
      filter: blur(12px)
    }

    .arr {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0, 0, 0, .92);
      border: 1px solid rgba(255, 255, 255, .1);
      color: var(--text);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: .15s;
      user-select: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .6)
    }

    .arr:hover {
      color: #fff !important;
      cursor: pointer;
      background: linear-gradient(90deg, #AB24F2, #7736F1);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .arr.off {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%) scale(.85)
    }

    #arr-p {
      left: .8rem
    }

    #arr-n {
      right: .8rem
    }

    #spf-host .page {
      background: #fff;
      overflow: hidden
    }

    #spf-host .page canvas {
      display: block;
      width: 100% !important;
      height: 100% !important
    }

    .sl-clip {
      overflow: hidden
    }

    .sl-track {
      display: flex;
      will-change: transform
    }

    .cf-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      overflow: visible
    }

    .cf-item {
      position: absolute;
      overflow: hidden;
      will-change: transform, opacity;
      transition: transform .5s cubic-bezier(.4, 0, .2, 1), opacity .5s, box-shadow .5s;
      cursor: pointer
    }

    .cards-wrap {
      position: relative
    }

    .card-item {
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 5px;
      overflow: hidden
    }

    .sp-wrap {
      overflow: hidden;
      will-change: opacity, transform
    }

    .nb-outer {
      display: flex;
      align-items: stretch
    }

    .nb-rings {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: .7rem .3rem;
      min-width: 28px;
      background: linear-gradient(180deg, #1a1a1a, #0f0f0f);
      border-radius: 7px 0 0 7px;
      border: 1px solid rgba(255, 255, 255, .05);
      border-right: none
    }

    .nb-ring {
      width: 20px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #333;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .8)
    }

    .nb-pg {
      overflow: hidden;
      border-radius: 0 5px 5px 0;
      will-change: transform, opacity
    }

    .alb-outer {
      position: relative
    }

    .alb-coils {
      position: absolute;
      top: -14px;
      left: 0;
      right: 0;
      height: 28px;
      z-index: 20;
      display: flex;
      justify-content: space-around;
      padding: 0 16px;
      align-items: center;
      pointer-events: none
    }

    .alb-coil {
      width: 20px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid #333;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, .8)
    }

    .alb-pg {
      overflow: hidden;
      border-radius: 2px;
      position: relative;
      top: 14px;
      will-change: transform, opacity
    }

    .ts {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: .45rem .8rem;
      background: var(--surface);
      border-top: 1px solid var(--border)
    }

    .ts::-webkit-scrollbar {
      height: 3px
    }

    .ts::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 99px
    }

    .thumb {
      flex-shrink: 0;
      width: 36px;
      border: 1.5px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
      transition: .12s
    }

    .thumb:hover {
      border-color: rgba(230, 51, 41, .5);
      transform: translateY(-2px)
    }

    .thumb.cur {
      border-color: #AB24F2;
      box-shadow: 0 0 0 1px #AB24F2;
    }

    .thumb canvas {
      display: block;
      width: 100%;
      height: auto
    }

    #err {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 56px);
      gap: 1rem;
      padding: 2rem;
      text-align: center
    }

    #err h2 {
      font-size: 1.2rem;
      font-weight: 700
    }

    #err p {
      color: var(--muted2);
      max-width: 340px;
      line-height: 1.7;
      font-size: .82rem
    }

    #err code {
      background: var(--s2);
      padding: .2rem .5rem;
      border-radius: 4px;
      font-size: .72rem;
      color: var(--accentl)
    }

    /* ── MOBILE RESPONSIVE ── */
    @media (max-width: 640px) {
      nav {
        padding: 0 .8rem;
        height: 48px;
      }

      .logo-txt {
        font-size: .78rem;
      }

      .nav-tag {
        font-size: .54rem;
        padding: .15rem .35rem;
        letter-spacing: .1em;
      }

      .vbar {
        top: 48px;
        padding: .3rem .5rem;
        gap: .2rem;
      }

      /* Hide less-used effect buttons on mobile; keep core ones */
      .vt[data-v="notebook"],
      .vt[data-v="coverflow"],
      .vt[data-v="cards"],
      .vt[data-v="album"] {
        display: none;
      }

      .vbr {
        gap: .2rem;
        padding: .25rem 0;
      }

      .vt {
        padding: .22rem .42rem;
        font-size: .56rem;
      }

      .pn {
        font-size: .62rem;
        min-width: 60px;
      }

      .zb {
        width: 24px;
        height: 22px;
        font-size: .85rem;
      }

      .z-val {
        font-size: .56rem;
        min-width: 28px;
      }

      .snd {
        font-size: .56rem;
        padding: .22rem .42rem;
      }

      /* Stage: account for smaller nav (48px) + taller toolbar */
      .stage {
        height: calc(100dvh - 48px - 60px - 52px);
        min-height: 200px;
      }

      /* Arrows: smaller and closer to edge */
      .arr {
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
      }

      #arr-p { left: .35rem; }
      #arr-n { right: .35rem; }

      /* Thumbnail strip: smaller thumbs */
      .ts {
        padding: .35rem .5rem;
      }

      .thumb {
        width: 28px;
      }
    }

    @media (max-width: 380px) {
      .vt[data-v="book"],
      .vt[data-v="slider"] {
        display: none;
      }

      .nav-tag {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="ld-logo">SquareZix</div>
    <div class="ld-bar">
      <div class="ld-fill" id="ldf"></div>
    </div>
    <div class="ld-txt" id="ldt">Loading Company Profile…</div>
  </div>

  <nav>
    <div class="logo">
      <img src="https://squarezix.com/wp-content/uploads/2024/05/cropped-SZ-Logo.png" alt="SquareZix"
        onerror="this.style.display='none'">
      <span class="logo-txt">SquareZix</span>
    </div>
    <span class="nav-tag">Company Profile</span>
  </nav>

  <div id="err">
    <h2>Could not load PDF</h2>
    <p>Place the PDF in the same folder as this HTML and open via a local server. Expected:</p>
    <code id="err-path"></code>
  </div>

  <section id="sv">
    <div class="vbar">
      <div class="vbl"><span class="pn" id="pn">Page 1 of —</span></div>
      <div class="vbr">
        <button class="vt on" data-v="magazine" onclick="swFx(this)">📖 Magazine</button>
        <!-- <button class="vt" data-v="notebook" onclick="swFx(this)">📓 Notebook</button> -->
        <button class="vt" data-v="book" onclick="swFx(this)">📚 Book</button>
        <button class="vt" data-v="slider" onclick="swFx(this)">🎞️ Slider</button>
        <!-- <button class="vt" data-v="coverflow" onclick="swFx(this)">🌀 Coverflow</button> -->
        <!-- <button class="vt" data-v="cards" onclick="swFx(this)">🃏 Cards</button> -->
        <!-- <button class="vt" data-v="onepage" onclick="swFx(this)">📃 Single</button> -->
        <!-- <button class="vt" data-v="album" onclick="swFx(this)">🖼️ Album</button> -->
        <div class="zoom-wrap">
          <button class="zb" onclick="zoom(-1)">−</button>
          <span class="z-val" id="zval">100%</span>
          <button class="zb" onclick="zoom(1)">+</button>
        </div>
        <div class="snd on" id="snd" onclick="toggleSnd()"><span id="sico">🔊</span> Sound</div>
      </div>
    </div>
    <div class="stage" id="stage">
      <button class="arr off" id="arr-p" onclick="goPrev()">&#8249;</button>
      <div id="book-root"></div>
      <button class="arr off" id="arr-n" onclick="goNext()">&#8250;</button>
    </div>
    <div class="ts" id="ts"></div>
  </section>

  <script>
    'use strict';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const PDF_URL = './SZ-Company-Profile-2027.pdf';

    /* STATE */
    let pdfDoc, total, DPR;
    let cache = [];
    let thumbs = [];
    let pgW, pgH;
    let zoomLvl = 1.0, effect = 'magazine', cur = 0, pf = null, busy = false, _st = {};
    let soundOn = true;

    /* SOUND */
    const SND = {};
    ['sm', 'md', 'lg'].forEach(k => { const a = new Audio(`./flip-sound.mp3`); a.preload = 'auto'; SND[k] = a; });
    let _ft = 0;
    function onFlipStart() { _ft = performance.now(); }
    function playFlip() {
      if (!soundOn) return;
      const v = Math.max(0.3, Math.min(2, 600 / (performance.now() - _ft || 400)));
      const a = SND[v > 1.5 ? 'lg' : v > 0.7 ? 'md' : 'sm'];
      a.currentTime = 0; a.volume = Math.min(1, 0.45 + v * 0.28); a.play().catch(() => { }); _ft = 0;
    }
    function toggleSnd() { soundOn = !soundOn; document.getElementById('snd').classList.toggle('on', soundOn); document.getElementById('sico').textContent = soundOn ? '🔊' : '🔇'; }

    /* ZOOM */
    function zoom(dir) {
      zoomLvl = Math.max(0.4, Math.min(2.5, Math.round((zoomLvl + dir * 0.1) * 10) / 10));
      document.getElementById('zval').textContent = Math.round(zoomLvl * 100) + '%';
      document.getElementById('book-root').style.transform = `scale(${zoomLvl})`;
    }
    document.addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); } }, { passive: false });
    document.addEventListener('keydown', e => {
      if (document.getElementById('sv').style.display === 'none') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goNext();
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goPrev();
      if (e.key === '=' || e.key === '+') zoom(1);
      if (e.key === '-') zoom(-1);
    });

    /* Helper: get stage dimensions accounting for actual rendered size */
    function getStageSize() {
      const el = document.getElementById('stage');
      return { w: el.clientWidth, h: el.clientHeight };
    }

    window.addEventListener('load', async () => {
      const setP = (p, msg) => { document.getElementById('ldf').style.width = p + '%'; document.getElementById('ldt').textContent = msg; };
      try {
        setP(10, 'Fetching PDF…');
        const res = await fetch(PDF_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();

        setP(30, 'Parsing…');
        pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
        total = pdfDoc.numPages;
        DPR = Math.min(window.devicePixelRatio || 1, 3);

        const vp0 = (await pdfDoc.getPage(1)).getViewport({ scale: 1 });
        const asp = vp0.height / vp0.width;
        const stW = window.innerWidth - 100, stH = window.innerHeight - 120;
        pgW = Math.floor((stW - 8) / 2);
        pgH = Math.round(pgW * asp);
        if (pgH > stH - 20) { pgH = stH - 20; pgW = Math.round(pgH / asp); }

        const physW = Math.round(pgW * DPR), physH = Math.round(pgH * DPR);
        const scale = physW / vp0.width;

        for (let i = 0; i < total; i++) {
          const pg = await pdfDoc.getPage(i + 1);

          const vp = pg.getViewport({ scale });
          const c = document.createElement('canvas');
          c.width = physW; c.height = physH;
          const ctx = c.getContext('2d', { alpha: false, willReadFrequently: true });
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, physW, physH);
          await pg.render({ canvasContext: ctx, viewport: vp }).promise;
          cache[i] = c;

          const tvp = pg.getViewport({ scale: 0.15 });
          const tc = document.createElement('canvas');
          tc.width = tvp.width; tc.height = tvp.height;
          const tx = tc.getContext('2d', { alpha: false, willReadFrequently: true });
          tx.fillStyle = '#fff'; tx.fillRect(0, 0, tc.width, tc.height);
          await pg.render({ canvasContext: tx, viewport: tvp }).promise;
          thumbs[i] = tc;

          setP(30 + Math.round(((i + 1) / total) * 65), `Rendering page ${i + 1} of ${total}…`);
        }

        setP(100, 'Ready');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('sv').style.display = 'block';
        build(effect); syncTabs(effect); buildThumbs();

      } catch (e) {
        console.error(e);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('err').style.display = 'flex';
        document.getElementById('err-path').textContent = PDF_URL;
      }
    });

    /* Redraw on resize */
    let _resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(_resizeTimer);
      _resizeTimer = setTimeout(() => { build(effect); }, 220);
    });

    function pageCanvas(i, w, h) {
      const wrap = document.createElement('div');
      wrap.style.cssText = `width:${w}px;height:${h}px;overflow:hidden;background:#fff;flex-shrink:0`;
      const c = document.createElement('canvas');
      c.width = Math.round(w * DPR);
      c.height = Math.round(h * DPR);
      c.style.cssText = `width:${w}px;height:${h}px;display:block`;
      c.getContext('2d', { alpha: false, willReadFrequently: true })
        .drawImage(cache[i], 0, 0, c.width, c.height);
      wrap.appendChild(c);
      return wrap;
    }

    /* DESTROY / BUILD */
    function destroy() { if (pf) { try { pf.destroy(); } catch (e) { } pf = null; } document.getElementById('book-root').innerHTML = ''; busy = false; _st = {}; }
    function build(e) {
      destroy();
      const { w, h } = getStageSize();
      if (e === 'magazine' || e === 'book') buildMagBook(e, w, h);
      else if (e === 'slider') buildSlider(w, h);
      else if (e === 'coverflow') buildCoverflow(w, h);
      else if (e === 'cards') buildCards(w, h);
      else if (e === 'onepage') buildOnePage(w, h);
      else if (e === 'album') buildAlbum(w, h);
      else if (e === 'notebook') buildNotebook(w, h);
      updateUI();
    }
    function swFx(btn) { effect = btn.dataset.v; syncTabs(effect); build(effect); }
    function syncTabs(e) { document.querySelectorAll('.vt[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === e)); }

    /* MAGAZINE / BOOK */
    function buildMagBook(mode, stW, stH) {
      const isMobile = window.innerWidth <= 640;
      const root = document.getElementById('book-root');
      const asp = pgH / pgW;

      let w, h;
      if (isMobile) {
        // On mobile show single page (full width)
        w = Math.min(stW - 40, pgW);
        h = Math.round(w * asp);
        if (h > stH - 20) { h = stH - 20; w = Math.round(h / asp); }
      } else {
        w = Math.min(Math.floor((stW - 80) / 2), pgW);
        h = Math.round(w * asp);
        if (h > stH - 20) { h = stH - 20; w = Math.round(h / asp); }
      }

      const host = document.createElement('div'); host.id = 'spf-host'; root.appendChild(host);
      const divs = [];
      for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'page';
        d.style.cssText = `width:${w}px;height:${h}px;overflow:hidden;background:#fff`;
        if (i === 0 || i === total - 1) d.dataset.density = 'hard';
        const c = document.createElement('canvas');
        c.width = Math.round(w * DPR); c.height = Math.round(h * DPR);
        c.style.cssText = `width:${w}px;height:${h}px;display:block`;
        c.getContext('2d', { alpha: false, willReadFrequently: true }).drawImage(cache[i], 0, 0, c.width, c.height);
        d.appendChild(c); host.appendChild(d); divs.push(d);
      }
      pf = new St.PageFlip(host, {
        width: w, height: h, size: 'fixed', drawShadow: true,
        flippingTime: mode === 'book' ? 440 : 860,
        usePortrait: isMobile, autoSize: true,
        maxShadowOpacity: mode === 'book' ? 0.30 : 0.72,
        showCover: true, mobileScrollSupport: false,
        useMouseEvents: true, swipeDistance: 16, clickEventForward: false, startPage: cur,
      });
      pf.loadFromHTML(divs);
      pf.on('changeState', onFlipStart);
      pf.on('flip', e => { cur = e.data; playFlip(); updateUI(); });
      _st = { w, h };
    }

    /* SLIDER */
    function buildSlider(stW, stH) {
      const asp = pgH / pgW; let w = stW - 40, h = Math.round(w * asp); if (h > stH - 20) { h = stH - 20; w = Math.round(h / asp); }
      const root = document.getElementById('book-root');
      const clip = document.createElement('div'); clip.className = 'sl-clip';
      clip.style.cssText = `width:${w}px;height:${h}px;box-shadow:0 14px 50px rgba(0,0,0,.75),0 60px 130px rgba(0,0,0,.8)`;
      const track = document.createElement('div'); track.className = 'sl-track';
      track.style.cssText = `width:${total * w}px;height:${h}px;transition:transform .55s cubic-bezier(.4,0,.2,1)`;
      for (let i = 0; i < total; i++) track.appendChild(pageCanvas(i, w, h));
      clip.appendChild(track); root.appendChild(clip);
      _st = { w, h, track }; addSwipe(clip); sliderTo(cur);
    }
    function sliderTo(i) { if (_st.track) _st.track.style.transform = `translateX(-${i * _st.w}px)`; }

    /* COVERFLOW */
    function buildCoverflow(stW, stH) {
      const asp = pgH / pgW;
      const isMobile = window.innerWidth <= 640;
      let w = Math.min(Math.round((stW - 40) * (isMobile ? .7 : .38)), isMobile ? 320 : 440);
      let h = Math.round(w * asp); if (h > stH - 40) { h = stH - 40; w = Math.round(h / asp); }
      const root = document.getElementById('book-root');
      const wrap = document.createElement('div'); wrap.className = 'cf-wrap';
      wrap.style.cssText = `width:${stW - 20}px;height:${h}px`;
      _st = { w, h, wrap }; root.appendChild(wrap); addSwipe(wrap); cfRender();
    }
    function cfRender() {
      const { w, h, wrap } = _st; if (!wrap) return; wrap.innerHTML = '';
      const isMobile = window.innerWidth <= 640;
      const offsets = isMobile ? [-1, 0, 1] : [-2, -1, 0, 1, 2];
      offsets.forEach(off => {
        const idx = cur + off; if (idx < 0 || idx >= total) return;
        const item = document.createElement('div'); item.className = 'cf-item';
        const ao = Math.abs(off), sc = off === 0 ? 1 : 1 - ao * .1, ry = off === 0 ? 0 : off > 0 ? -52 : 52, tx = off * w * .7;
        item.style.cssText = `width:${w}px;height:${h}px;transform:translateX(${tx}px) rotateY(${ry}deg) scale(${sc});z-index:${10 - ao * 2};opacity:${ao > 1 ? .34 : ao === 1 ? .68 : 1};box-shadow:${off === 0 ? '0 0 0 1px rgba(255,255,255,.06),0 30px 100px rgba(0,0,0,.95)' : '0 10px 40px rgba(0,0,0,.65)'}`;
        item.appendChild(pageCanvas(idx, w, h));
        if (off !== 0) item.onclick = () => { cur = idx; playFlip(); cfRender(); updateUI(); };
        wrap.appendChild(item);
      });
    }

    /* CARDS */
    function buildCards(stW, stH) {
      const asp = pgH / pgW;
      const isMobile = window.innerWidth <= 640;
      let w = Math.min(Math.round((stW - 40) * (isMobile ? .88 : .58)), isMobile ? 400 : 580);
      let h = Math.min(Math.round(w * asp), stH - 60); w = Math.round(h / asp);
      const root = document.getElementById('book-root');
      const stage = document.createElement('div'); stage.className = 'cards-wrap';
      stage.style.cssText = `width:${w}px;height:${h + 32}px;perspective:1000px`;
      _st = { w, h, stage }; root.appendChild(stage); addSwipe(stage); cardsRender();
    }
    function cardsRender() {
      const { w, h, stage } = _st; if (!stage) return; stage.innerHTML = '';
      [2, 1, 0].forEach(b => {
        const idx = Math.max(0, Math.min(total - 1, cur - b));
        const card = document.createElement('div'); card.className = 'card-item';
        card.style.cssText = `width:${w}px;height:${h}px;transform:scale(${1 - b * .032}) translateY(${b * 10}px);transform-origin:center bottom;z-index:${10 - b};box-shadow:0 ${5 + b * 4}px ${24 + b * 16}px rgba(0,0,0,${.58 + b * .09})`;
        card.appendChild(pageCanvas(idx, w, h)); stage.appendChild(card);
      });
    }
    function cardsFlip(dir) {
      const { stage } = _st; if (!stage || busy) return; busy = true;
      const top = stage.lastElementChild; if (!top) { busy = false; return; }
      top.style.transition = 'transform .45s cubic-bezier(.645,.045,.355,1),opacity .35s ease';
      top.style.transformOrigin = 'center bottom';
      top.style.transform = `perspective(950px) rotateX(${dir === 'next' ? -175 : 175}deg) scale(.85)`;
      top.style.opacity = '0';
      setTimeout(() => { cardsRender(); busy = false; }, 470);
    }

    /* ONE PAGE */
    function buildOnePage(stW, stH) {
      const asp = pgH / pgW; let w = stW - 40, h = Math.round(w * asp); if (h > stH - 20) { h = stH - 20; w = Math.round(h / asp); }
      const root = document.getElementById('book-root');
      const wrap = document.createElement('div'); wrap.className = 'sp-wrap';
      wrap.style.cssText = `width:${w}px;height:${h}px;box-shadow:0 10px 40px rgba(0,0,0,.7),0 60px 130px rgba(0,0,0,.85)`;
      wrap.appendChild(pageCanvas(cur, w, h)); root.appendChild(wrap);
      _st = { w, h, wrap }; addSwipe(wrap);
    }
    function oneFlip() {
      const { w, h, wrap } = _st; if (!wrap || busy) return; busy = true;
      wrap.style.transition = 'opacity .18s ease,transform .18s ease';
      wrap.style.opacity = '0'; wrap.style.transform = 'scale(1.04)';
      setTimeout(() => {
        wrap.innerHTML = ''; wrap.appendChild(pageCanvas(cur, w, h));
        wrap.style.transition = 'none'; wrap.style.opacity = '0'; wrap.style.transform = 'scale(.97)';
        requestAnimationFrame(() => {
          wrap.style.transition = 'opacity .28s ease,transform .28s ease';
          wrap.style.opacity = '1'; wrap.style.transform = 'scale(1)';
          setTimeout(() => busy = false, 300);
        });
      }, 200);
    }

    /* ALBUM */
    function buildAlbum(stW, stH) {
      const asp = pgH / pgW; let w = stW - 40, h = Math.round(w * asp); if (h > stH - 60) { h = stH - 60; w = Math.round(h / asp); }
      const root = document.getElementById('book-root');
      const outer = document.createElement('div'); outer.className = 'alb-outer'; outer.style.cssText = `width:${w}px;height:${h + 14}px`;
      const coils = document.createElement('div'); coils.className = 'alb-coils';
      for (let i = 0; i < 12; i++) { const c = document.createElement('div'); c.className = 'alb-coil'; coils.appendChild(c); }
      const pg = document.createElement('div'); pg.className = 'alb-pg';
      pg.style.cssText = `width:${w}px;height:${h}px;box-shadow:0 24px 70px rgba(0,0,0,.82)`;
      pg.appendChild(pageCanvas(cur, w, h));
      outer.appendChild(coils); outer.appendChild(pg); root.appendChild(outer);
      _st = { w, h, pg }; addSwipe(outer);
    }
    function albumFlip() {
      const { w, h, pg } = _st; if (!pg || busy) return; busy = true;
      pg.style.transition = 'transform .5s cubic-bezier(.645,.045,.355,1),opacity .26s ease';
      pg.style.transformOrigin = 'center top';
      pg.style.transform = 'perspective(1500px) rotateX(-185deg)'; pg.style.opacity = '0';
      setTimeout(() => {
        pg.innerHTML = ''; pg.appendChild(pageCanvas(cur, w, h));
        pg.style.transition = 'none'; pg.style.transform = 'perspective(1500px) rotateX(185deg)'; pg.style.opacity = '0';
        requestAnimationFrame(() => {
          pg.style.transition = 'transform .5s cubic-bezier(.645,.045,.355,1),opacity .22s ease';
          pg.style.transform = 'perspective(1500px) rotateX(0deg)'; pg.style.opacity = '1';
          setTimeout(() => busy = false, 520);
        });
      }, 280);
    }

    /* NOTEBOOK */
    function buildNotebook(stW, stH) {
      const asp = pgH / pgW;
      const isMobile = window.innerWidth <= 640;
      let w = Math.min(Math.round((stW - 40) * (isMobile ? .9 : .68)), isMobile ? 400 : 720);
      let h = Math.min(Math.round(w * asp), stH - 40); w = Math.round(h / asp);
      const root = document.getElementById('book-root');
      const outer = document.createElement('div'); outer.className = 'nb-outer';
      const rings = document.createElement('div'); rings.className = 'nb-rings'; rings.style.height = h + 'px';
      for (let i = 0; i < 13; i++) { const r = document.createElement('div'); r.className = 'nb-ring'; rings.appendChild(r); }
      const pg = document.createElement('div'); pg.className = 'nb-pg';
      pg.style.cssText = `width:${w}px;height:${h}px;box-shadow:6px 0 28px rgba(0,0,0,.62),0 35px 90px rgba(0,0,0,.78)`;
      pg.appendChild(pageCanvas(cur, w, h));
      outer.appendChild(rings); outer.appendChild(pg); root.appendChild(outer);
      _st = { w, h, pg }; addSwipe(outer);
    }
    function nbFlip(dir) {
      const { w, h, pg } = _st; if (!pg || busy) return; busy = true;
      const out = dir === 'next' ? '-55px' : '55px', inn = dir === 'next' ? '55px' : '-55px';
      pg.style.transition = 'transform .28s ease,opacity .26s ease';
      pg.style.transform = `translateX(${out})`; pg.style.opacity = '0';
      setTimeout(() => {
        pg.innerHTML = ''; pg.appendChild(pageCanvas(cur, w, h));
        pg.style.transition = 'none'; pg.style.transform = `translateX(${inn})`; pg.style.opacity = '0';
        requestAnimationFrame(() => {
          pg.style.transition = 'transform .36s cubic-bezier(.4,0,.2,1),opacity .3s ease';
          pg.style.transform = 'translateX(0)'; pg.style.opacity = '1';
          setTimeout(() => busy = false, 380);
        });
      }, 290);
    }

    /* SWIPE */
    function addSwipe(el) {
      let sx = 0;
      el.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
      el.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - sx; if (dx < -30) goNext(); else if (dx > 30) goPrev(); });
    }

    /* NAVIGATION */
    function goNext() {
      if (busy) return;
      if (effect === 'magazine' || effect === 'book') { if (pf) { onFlipStart(); pf.flipNext('bottom'); } return; }
      if (cur >= total - 1) return; cur++; playFlip(); dispatch('next');
    }
    function goPrev() {
      if (busy) return;
      if (effect === 'magazine' || effect === 'book') { if (pf) { onFlipStart(); pf.flipPrev('bottom'); } return; }
      if (cur <= 0) return; cur--; playFlip(); dispatch('prev');
    }
    function dispatch(dir) {
      if (effect === 'slider') sliderTo(cur);
      else if (effect === 'coverflow') cfRender();
      else if (effect === 'cards') cardsFlip(dir);
      else if (effect === 'onepage') oneFlip();
      else if (effect === 'album') albumFlip();
      else if (effect === 'notebook') nbFlip(dir);
      updateUI();
    }
    function jumpTo(idx) {
      if (effect === 'magazine' || effect === 'book') { if (pf) { pf.flip(idx); return; } }
      const dir = idx > cur ? 'next' : 'prev'; cur = idx; playFlip(); dispatch(dir); updateUI();
    }

    /* UI */
    function updateUI() {
      document.getElementById('pn').textContent = `Page ${cur + 1} of ${total}`;
      document.getElementById('arr-p').classList.toggle('off', cur <= 0);
      document.getElementById('arr-n').classList.toggle('off', cur >= total - 1);
      document.querySelectorAll('.thumb').forEach((t, i) => { t.classList.toggle('cur', i === cur); if (i === cur) t.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' }); });
    }
    function buildThumbs() {
      const strip = document.getElementById('ts'); strip.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const wrap = document.createElement('div'); wrap.className = 'thumb' + (i === 0 ? ' cur' : '');
        const c = document.createElement('canvas'); c.width = thumbs[i].width; c.height = thumbs[i].height;
        c.getContext('2d').drawImage(thumbs[i], 0, 0); wrap.appendChild(c);
        wrap.onclick = () => jumpTo(i); strip.appendChild(wrap);
      }
    }
  </script>
</body>
